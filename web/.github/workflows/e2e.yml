name: e2e.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-website:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Selenium Website Tests
        run: |
          python scripts/test_selenium.py

      - name: Upload Selenium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: results/selenium-results.json
          retention-days: 7

  appium-android:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Appium Android Tests
        run: |
          python scripts/test_appium.py

      - name: Upload Appium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-results
          path: results/appium-results.json
          retention-days: 7

  unit-tests-api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run API Unit & Integration Tests
        run: |
          python scripts/test_api.py

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: results/api-results.json
          retention-days: 7

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Validation Tests
        run: |
          python scripts/test_validation.py

      - name: Upload Validation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/validation-results.json
          retention-days: 7

  deployment-status:
    name: Deployment Status (100)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deployment Probes
        run: |
          python scripts/test_deployment.py

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-results
          path: results/deployment-results.json
          retention-days: 7

  load-testing:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Load Testing
        run: |
          python scripts/test_load.py

      - name: Upload Load Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: results/load-results.json
          retention-days: 7

  compile-master-report:
    name: Compile Master Report & Deploy
    needs: [selenium-website, appium-android, unit-tests-api, validation-tests, deployment-status, load-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Dependencies
        run: |
          pip install openpyxl

      - name: Download Selenium Artifact
        uses: actions/download-artifact@v4
        with:
          name: selenium-results
          path: results

      - name: Download Appium Artifact
        uses: actions/download-artifact@v4
        with:
          name: appium-results
          path: results

      - name: Download API Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-results
          path: results

      - name: Download Validation Artifact
        uses: actions/download-artifact@v4
        with:
          name: validation-results
          path: results

      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-results
          path: results

      - name: Download Load Artifact
        uses: actions/download-artifact@v4
        with:
          name: load-results
          path: results

      - name: Compile Master Multi-Tab Excel Report
        run: |
          export PYTHONPATH="${PYTHONPATH}:scripts"
          python scripts/compile_master_report.py

      - name: Upload Master Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: SecureMe_Master_Execution_Report
          path: SecureMe_Master_Execution_Report.xlsx
          retention-days: 30

