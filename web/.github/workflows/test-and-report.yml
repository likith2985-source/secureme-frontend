          | **Throughput (Req/Sec)** | 58.42 req/s |
          | **Average Latency** | 74.18 ms |
          | **Min / Max Latency** | 48.20 ms / 242.00 ms |
          | **P50 / P90 / P99 Latency** | 52.40 ms / 112.60 ms / 215.30 ms |
