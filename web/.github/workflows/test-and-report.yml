name: SecureMe Automated Test Suite & Report Generator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-generate-report:
    name: Run Full QA Suite & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests httpx pytest

      - name: ⬢ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Frontend Dependencies
        run: npm ci || npm install

      - name: 🧪 Run React Component Unit & Integration Tests
        env:
          CI: true
        run: |
          npm test -- --watchAll=false --forceExit

      - name: 📊 Execute Full QA Suite (E2E, API, Load, Vulnerability) & Generate Excel Report
        run: |
          python scripts/run_full_test_suite.py

      - name: 💾 Upload Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureMe_Test_Execution_Report
          path: SecureMe_Test_Execution_Report.xlsx
          retention-days: 30

      - name: 📝 Publish Rich Test Execution Dashboard to GitHub Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
